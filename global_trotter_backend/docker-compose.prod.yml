services:
  api-gateway:
    ports: !override
      - "127.0.0.1:6000:5000"
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "8", "--timeout", "60", "app:app"]

  destination-service:
    volumes: !override
      - ./destination-service/data:/app/data
      - /var/www/globaltrotter-uploads:/app/uploads